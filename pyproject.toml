[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gardiner2unicode"
version = "1.0.0"
description = "Mapping Gardiner's codes to Unicode + generating corresponding images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Anton Alekseev", email = "anton.m.alexeyev@gmail.com" },
]
keywords = ["egyptology", "ancient egypt", "hieroglyphs", "unicode", "fonts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "wikitextparser>=0.55.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/alexeyev/gardiner2unicode"
Repository = "https://github.com/alexeyev/gardiner2unicode"

[tool.setuptools.packages.find]
include = ["gardiner2unicode*"]

[tool.setuptools.package-data]
gardiner2unicode = ["data/*.wiki", "data/*.ttf"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort (I), pyupgrade (UP), flake8-bugbear (B)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=gardiner2unicode --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["gardiner2unicode"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
